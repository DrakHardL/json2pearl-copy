stages:
  - install
  - build
  - deploy

variables:
  NODE_ENV: production
  # Dossier de build Angular
  BUILD_DIR: dist/json2pearl/browser
  # Empêche npm d'utiliser le cache global
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/

install_dependencies:
  stage: install
  image: node:20
  script:
    - npm ci --prefer-offline --no-audit
  artifacts:
    paths:
      - node_modules/
    expire_in: 1h

build_app:
  stage: build
  image: node:20
  script:
    - npx ng build --configuration production
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  dependencies:
    - install_dependencies
  only:
    - main
    - tags

# Déploiement sur GitLab Pages
pages:
  stage: deploy
  image: node:20
  script:
    - mkdir -p public
    - cp -r $BUILD_DIR/* public/ || (ls -la dist/ && exit 1)
  artifacts:
    paths:
      - public
  dependencies:
    - build_app
  only:
    - main