<div class="rectangleInfoGroup" style="z-index: 1000;">
  <div class="group-header">
    <div style="display: flex; align-items: center; justify-content: center; gap: 0.5vw;">
      <img src="GroupIcon.svg" alt="Group Icon" style="width: 1.5vw; height: 1.5vw;">
      <h3>{{ name || 'Groupe sans nom' }}</h3>
    </div>
  </div>

  <div class="info-section">
    <p class="info-value">{{ createdAt ? (createdAt | date:'dd/MM/yyyy') : 'Date non spécifiée' }}</p>
  </div>

  <div class="description-section">
    <p class="label">Description :</p>
    <p class="description">{{ description || 'Aucune description disponible' }}</p>
  </div>

  <div class="link-section">
    @if (webUrl) {
      <p class="label">Lien du groupe :</p>
      <a [href]="webUrl" target="_blank" class="group-link">
        <img src="open.svg" alt="Open" style="width: 1.2vw; height: 1.2vw; vertical-align: middle; margin-right: 0.3vw;">
        <span class="text">Ouvrir le groupe</span>
      </a>
    }
  </div>
</div>
