<div class="rectangleInfoUtilisateur">
  <div class="left">
    <div class="header">
      <h3>{{ utilisateurName }}</h3>
    </div>
  </div>
  <div class="right">
    <div class="info-section">
      <p class="info-label">Rôle :</p>
      <p class="info-value">{{ utilisateurRole || 'Non spécifié' }}</p>
    </div>
    <div class="info-section">
      <p class="info-label">Nombre de projets :</p>
      <p class="info-value">{{ utilisateurNombreProjets || 0 }}</p>
    </div>
  </div>
</div>
